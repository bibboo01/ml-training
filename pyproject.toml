[project]
name = "ml-training"
version = "0.4.0"
description = "Automated ML training system: Hydra configs, DVC data versioning, MLflow tracking/registry, Optuna HPO, confusion-matrix metrics and Excel reports."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "mlflow>=3.0",
    "xlsxwriter>=3.2",
    "dvc>=3.50",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Deep learning backend (PyTorch Lightning). Install with: uv sync --extra dl
dl = [
    "torch>=2.2",
    "lightning>=2.2",
]
yolo = [
    "ultralytics>=8.3",
]

[dependency-groups]
# Level 4 tooling – already wired so it is ready when you move up a level.
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "ipykernel>=6.29",
]

[project.scripts]
mlt-prepare = "ml_training.dataset:main"
mlt-featurize = "ml_training.features:main"
mlt-train = "ml_training.modeling.train:main"
mlt-predict = "ml_training.modeling.predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_training"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
