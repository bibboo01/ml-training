# @package _global_
# Quick results: shorter training and a small search over the optimiser only.
tune:
  name: fast
  search_space:
    lr0: {type: float, low: 1.0e-4, high: 2.0e-2, log: true}
    momentum: {type: float, low: 0.85, high: 0.98}
    weight_decay: {type: float, low: 0.0, high: 1.0e-3}
model:
  hpo_epochs: 5
  params:
    epochs: 50
    patience: 15
hpo:
  n_trials: 10
