# Main Hydra config. Override anything from the command line, e.g.
#   uv run mlt-train model=logistic_regression hpo.n_trials=50
#   uv run mlt-train data=csv data.path=data/raw/my.csv data.target=label
defaults:
  - data: breast_cancer
  - model: random_forest
  - hpo: optuna
  - tune: default        # YOLO tuning preset: fast | balanced | accurate | small_data | freeze | augment | custom
  - _self_

seed: 42
experiment_name: ${data.name}

paths:
  root: ${hydra:runtime.cwd}
  raw: ${paths.root}/data/raw
  processed: ${paths.root}/data/processed/${data.name}
  models: ${paths.root}/models
  reports: ${paths.root}/reports
  # Per-run outputs (Excel report, metrics.json, figures, model file)
  run_reports: ${paths.reports}/${data.name}/${model.name}
  run_model: ${paths.models}/${data.name}/${model.name}.joblib

mlflow:
  # SQLite backend is required for the Model Registry and works on Windows.
  tracking_uri: sqlite:///${paths.root}/mlflow.db
  artifact_location: ${paths.root}/mlruns
  register_model: true
  registered_model_name: ${data.name}-${model.name}
  system_metrics: true       # CPU / RAM / disk / GPU usage during training (MLflow "System metrics")
  log_predictions: true      # every mlt-predict / "find" becomes an MLflow run (stage=predict)
  log_weights: true          # also keep last.pt + the whole Ultralytics run folder as artifacts
  history_file: ${paths.root}/logs/history.jsonl   # one line per command, never cleaned

evaluation:
  # Average used for the headline precision/recall/F1 (binary | macro | weighted)
  average: macro
  # Threshold for binary classification on predict_proba
  threshold: 0.5

xai:                     # .\run.ps1 explain <dataset>  (heatmaps + statistics workbook)
  split: auto              # auto = test, else val
  max_images: 100          # images to analyse (0 = all)
  conf: 0.25               # a prediction counts from this confidence
  iou: 0.5                 # IoU needed to count as TP
  low_conf: 0.01           # predictions kept for the threshold sweep / calibration
  max_boxes: 20            # Grad-CAM heatmaps per image (highest confidence first)
  bootstrap: 1000          # resamples for the 95% confidence intervals
  imgsz: null              # null = the size the model was trained with
  gallery: 12              # images shown in the Gallery sheet (worst first)
  seed: 0

report:
  excel: true
  filename: report.xlsx

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
