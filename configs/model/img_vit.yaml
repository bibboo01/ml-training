# ViT-B/16 (86M params): Vision Transformer; best with lots of data, needs ~8 GB VRAM.
name: img_vit
backend: vision
arch: vit_base_patch16_224
pretrained: true          # ImageNet weights from the HuggingFace hub (downloaded once)
params:
  epochs: 30
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.05
  imgsz: 224
  patience: 6
  amp: true
  label_smoothing: 0.1
  warmup_epochs: 1
search_space:
  lr: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  weight_decay: {type: float, low: 1.0e-4, high: 0.1, log: true}
  batch_size: {type: categorical, choices: [16, 32, 64]}
  label_smoothing: {type: float, low: 0.0, high: 0.2}
