# LightGBM: fast gradient boosting – usually the strongest choice for tables and forecasting.
# Needs the "boost" extra (installed by .\run.ps1 setup-yolo / setup-gpu).
name: lightgbm
backend: sklearn
class_path: lightgbm.LGBMClassifier
regressor: lightgbm.LGBMRegressor
params:
  n_estimators: 400
  learning_rate: 0.05
  num_leaves: 31
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  random_state: ${seed}
  n_jobs: -1
  verbose: -1
search_space:
  n_estimators: {type: int, low: 100, high: 1500, step: 100}
  learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
  num_leaves: {type: int, low: 8, high: 128, log: true}
  min_child_samples: {type: int, low: 5, high: 100, log: true}
  subsample: {type: float, low: 0.5, high: 1.0}
  colsample_bytree: {type: float, low: 0.4, high: 1.0}
  reg_lambda: {type: float, low: 1.0e-8, high: 10.0, log: true}
