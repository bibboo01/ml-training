name: logistic_regression
backend: sklearn
class_path: sklearn.linear_model.LogisticRegression
regressor: sklearn.linear_model.Ridge          # linear regression with L2 penalty
params:
  max_iter: 2000
  random_state: ${seed}
search_space:
  C: {type: float, low: 1.0e-4, high: 100.0, log: true}
  class_weight: {type: categorical, choices: [null, balanced]}
regressor_search_space:
  alpha: {type: float, low: 1.0e-4, high: 100.0, log: true}
