name: gradient_boosting
backend: sklearn
class_path: sklearn.ensemble.HistGradientBoostingClassifier
regressor: sklearn.ensemble.HistGradientBoostingRegressor
params:
  random_state: ${seed}
search_space:
  learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
  max_iter: {type: int, low: 50, high: 500, step: 50}
  max_leaf_nodes: {type: int, low: 8, high: 64}
  l2_regularization: {type: float, low: 1.0e-6, high: 1.0, log: true}
